name: CI
on:
  push:
    branches: [main, next, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Lint and Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:bookworm-slim
          - distro: arch
            image: archlinux:latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
          ubuntu|debian)
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              shellcheck shfmt bats git ca-certificates make python3
            ;;
          arch)
            pacman -Sy --noconfirm --needed shellcheck shfmt bats git make python
            ;;
          esac
        shell: bash

      - name: Lint
        run: make lint

      - name: Test
        run: make test-unit

      # Installs into a temporary prefix, runs that copy (help, version), then
      # checks that uninstall leaves nothing behind
      - name: Install check
        run: make installcheck

  integration-test:
    name: Kill-switch Integration Test
    needs: unit-tests # Waits for fast tests to pass first
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the WireGuard module
        run: sudo modprobe wireguard || echo "wireguard unavailable; the suite will use a veth"

      - name: Run kill-switch integration suite
        run: make test-integration
