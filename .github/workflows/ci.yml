name: CI
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Lint and Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:bookworm-slim
          - distro: arch
            image: archlinux:latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
          ubuntu|debian)
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              shellcheck shfmt bats git ca-certificates make
            ;;
          arch)
            pacman -Sy --noconfirm --needed shellcheck shfmt bats git make
            ;;
          esac
        shell: bash

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test Makefile Installation
        run: |
          set -euo pipefail
          # Install in CI container
          make install prefix=/usr

          # 1. Verify file placement
          test -x "/usr/bin/wg-vpn"
          test -d "/usr/share/wg-vpn"
          test -f "/usr/share/wg-vpn/core.sh" 
          test -f "/usr/share/wg-vpn/routers.sh" 
          test -f "/usr/share/wg-vpn/commands/misc.sh"
          test -f "/usr/share/wg-vpn/commands/toggle-vpn.sh" 
          test -f "/usr/share/wg-vpn/commands/config.sh"

          # 2. Verify sed injection patched local LIB_DIR
          grep -q "/usr/share/wg-vpn" "/usr/bin/wg-vpn" || {
            echo "ERROR: Makefile failed to patch LIB_DIR variable."
            exit 1
          }

          # 3. Smoke test the installed binary
          "/usr/bin/wg-vpn" help | grep -q "Usage:" || {
            echo ERROR: 'wg-vpn help' smoke test failed.
            exit 1
          }

          # 4. Verify uninstall cleanup
          make uninstall prefix=/usr
          test ! -e "/usr/bin/wg-vpn"
          test ! -e "/usr/share/wg-vpn"
        shell: bash

  integration-test:
    name: Killswitch Integration Test
    needs: unit-tests # Waits for fast tests to pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats ufw iproute2 python3

      - name: Run Integration Test
        # CI=true is automatically set by GitHub, so the Makefile
        # routes to the raw bats execution.
        run: sudo make test-integration
